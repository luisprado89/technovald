# ============================================================
# TechNovaLD — entorno Docker
# ============================================================
# La app se ejecuta con el perfil prod. El servicio `seed` es
# una ejecución one-shot con perfil dev para cargar datos de
# demostración sobre los mismos volúmenes.
#
# Uso:
#   docker compose build
#   docker compose up -d mysql mongodb
#   docker compose run --rm seed
#   docker compose up -d app
# ============================================================

x-app-environment: &app-environment
  MYSQL_HOST: mysql
  MYSQL_PORT: "3306"
  MYSQL_DATABASE: ${MYSQL_DATABASE}
  MYSQL_USER: ${MYSQL_APP_USER:-technovald}
  MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-technovald}
  MONGO_URI: mongodb://mongodb:27017/${MONGO_DATABASE}
  JWT_SECRET: ${JWT_SECRET}
  JWT_EXPIRATION: ${JWT_EXPIRATION}
  BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME:?BOOTSTRAP_ADMIN_USERNAME debe estar definido en .env}
  BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD:?BOOTSTRAP_ADMIN_PASSWORD debe estar definido en .env}
  ICECAT_URL: ${ICECAT_URL}
  ICECAT_TOKEN: ${ICECAT_TOKEN}
  GMAIL_USER: ${GMAIL_USER}
  GMAIL_APP_PASSWORD: ${GMAIL_APP_PASSWORD}
  TZ: Europe/Madrid

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_DATABASE: ${MYSQL_DATABASE}
      MYSQL_USER: ${MYSQL_APP_USER:-technovald}
      MYSQL_PASSWORD: ${MYSQL_APP_PASSWORD:-technovald}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    ports:
      - "${MYSQL_HOST_PORT:-3307}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$${MYSQL_ROOT_PASSWORD}\" --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    restart: unless-stopped

  mongodb:
    image: mongo:7.0
    ports:
      - "${MONGO_HOST_PORT:-27018}:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --eval 'db.adminCommand({ ping: 1 }).ok' | grep -q 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    restart: unless-stopped

  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: technovald-app:local
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: prod
      APP_SEED_ENABLED: "false"
      PORT: "8080"
      JAVA_OPTS: "-XX:MaxRAMPercentage=75 -Dfile.encoding=UTF-8"
    ports:
      - "${APP_PORT:-8081}:8080"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:8080/actuator/health | grep -q '\"status\":\"UP\"'"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 45s
    restart: unless-stopped

  # Ejecución única para cargar los datos de demostración.
  # No forma parte del arranque normal de la app.
  seed:
    profiles: ["seed"]
    image: technovald-app:local
    environment:
      <<: *app-environment
      SPRING_PROFILES_ACTIVE: dev
      APP_SEED_ENABLED: "true"
      SPRING_MAIN_WEB_APPLICATION_TYPE: none
      JAVA_OPTS: "-Dfile.encoding=UTF-8"
    depends_on:
      mysql:
        condition: service_healthy
      mongodb:
        condition: service_healthy
    restart: "no"

volumes:
  mysql_data:
  mongo_data:
