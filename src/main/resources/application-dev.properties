# Perfil de desarrollo (spring.profiles.default=dev)

# Puerto fijo para desarrollo local para evitar conflictos con variables de entorno locales.
server.port=8080

# Mostrar SQL y trazas en consola para depurar
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.technovald=DEBUG

# Seed de datos de demostración. Desactivado por defecto para que los tests
# no consulten Icecat ni inserten datos; se activa con APP_SEED_ENABLED=true.
app.seed.enabled=${APP_SEED_ENABLED:false}