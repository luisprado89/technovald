# Perfil de desarrollo (spring.profiles.default=dev)

# Puerto fijo para desarrollo local para evitar conflictos con variables de entorno locales.
server.port=8080

# Mostrar SQL y trazas en consola para depurar
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
logging.level.com.technovald=DEBUG

# Seed de datos de demostración. Activado por defecto en desarrollo para que
# el IDE cree admin + datos demo al arrancar. Se puede desactivar con
# APP_SEED_ENABLED=false. Los tests lo desactivan desde Surefire.
app.seed.enabled=${APP_SEED_ENABLED:true}