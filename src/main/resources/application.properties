# ===========================================
# CONFIGURACIÓN COMÚN - TECHNOVALD
# ===========================================

spring.application.name=TechNovaLD


# ===========================================
# FICHERO DE ENTORNO LOCAL
# ===========================================

# Carga el archivo .env de la raíz como fuente de propiedades en local.
# El prefijo "optional:" evita el fallo cuando el archivo no existe y las
# variables ya vienen definidas por el entorno.
spring.config.import=optional:file:.env[.properties]


# ===========================================
# MYSQL
# ===========================================

# MYSQL_DATABASE, MYSQL_USER y MYSQL_PASSWORD no llevan valor por defecto a
# propósito: si falta alguno, la aplicación falla al arrancar en lugar de
# conectarse en silencio a una base de datos equivocada.
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE}?useSSL=false&serverTimezone=UTC&createDatabaseIfNotExist=true&allowPublicKeyRetrieval=true
spring.datasource.username=${MYSQL_USER}
spring.datasource.password=${MYSQL_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# ===========================================
# JPA / HIBERNATE
# ===========================================

# validate: Hibernate solo comprueba que cada entidad coincide con su tabla.
# El esquema lo crea y lo evoluciona Flyway con las migraciones versionadas de
# src/main/resources/db/migration/. NO se usa update: Hibernate nunca modifica
# el esquema de la base de datos, solo lo valida al arrancar.
spring.jpa.hibernate.ddl-auto=validate


# ===========================================
# JWT
# ===========================================

# Clave de firma de los tokens, en Base64, de al menos 32 bytes (256 bits).
# Sin valor por defecto: si falta, la aplicación no arranca.
jwt.secret=${JWT_SECRET}

# Vida del token en milisegundos. 86400000 son 24 horas.
jwt.expiration=${JWT_EXPIRATION}

# ===========================================
# ADMINISTRADOR INICIAL
# ===========================================

# Credenciales del primer administrador, leídas del .env. Se usan una sola vez:
# en el primer arranque sobre una base de datos sin usuarios. Se dejan sin
# valor por defecto para que, si faltan, el arranque falle en lugar de crear un
# administrador con credenciales conocidas.
app.bootstrap.admin-username=${BOOTSTRAP_ADMIN_USERNAME:}
app.bootstrap.admin-password=${BOOTSTRAP_ADMIN_PASSWORD:}